<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tải Game Fising Slot</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           CSS RESET & SETUP CƠ BẢN
        ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            /* Tạo nền gradient đại dương sâu thẳm */
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden; /* Giấu các bong bóng bay ra ngoài màn hình */
            position: relative;
        }

        /* =========================================
           HIỆU ỨNG BONG BÓNG ĐẠI DƯƠNG BAY LÊN
        ========================================= */
        .bubbles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .bubble {
            position: absolute;
            bottom: -100px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: floatUp 10s infinite ease-in;
        }
        /* Tạo kích thước và vị trí ngẫu nhiên cho 5 bong bóng */
        .bubble:nth-child(1) { width: 40px; height: 40px; left: 10%; animation-duration: 8s; }
        .bubble:nth-child(2) { width: 80px; height: 80px; left: 30%; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 30px; height: 30px; left: 60%; animation-duration: 6s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 60px; height: 60px; left: 80%; animation-duration: 10s; animation-delay: 1s; }
        .bubble:nth-child(5) { width: 50px; height: 50px; left: 50%; animation-duration: 9s; animation-delay: 5s; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        /* =========================================
           KHUNG GIAO DIỆN KÍNH MỜ (GLASSMORPHISM)
        ========================================= */
        .mobile-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            border-radius: 30px;
            /* Hiệu ứng kính mờ nghệ thuật */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            /* Viền phát sáng nhẹ */
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s;
        }

        /* =========================================
           HÌNH ẢNH & CHỮ NGHỆ THUẬT
        ========================================= */
        .icon-game {
            font-size: 70px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }

        h1 {
            /* Chữ đổ bóng Gradient vàng Hoàng Gia */
            background: linear-gradient(to right, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.desc {
            color: #e0e0e0;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 400;
            padding: 0 10px;
        }

        /* =========================================
           NÚT TẢI GAME KHỔNG LỒ (HIỆU ỨNG NHỊP TIM)
        ========================================= */
        .btn-download {
            display: inline-block;
            width: 90%;
            background: linear-gradient(45deg, #ff9800, #ff5722);
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            padding: 18px 20px;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(255, 87, 34, 0.4);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            /* Animation đập nhịp tim thu hút sự chú ý */
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 87, 34, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 87, 34, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 87, 34, 0); }
        }

        /* Hiệu ứng lún xuống cực mượt khi bấm */
        .btn-download:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(255, 87, 34, 0.4);
        }

        /* Dải sáng chạy ngang qua nút */
        .btn-download::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* =========================================
           THÔNG TIN FOOTER
        ========================================= */
        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: #b0bec5;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        
        .badge {
            background: rgba(0, 255, 106, 0.1);
            color: #00ff6a;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 11px;
            border: 1px solid rgba(0, 255, 106, 0.3);
            margin-bottom: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="mobile-container">
        <div class="badge">🔥 Phiên bản Mới Nhất 1.1</div>
        <div class="icon-game">🎣🎰🌾</div>
        
        <h1>FISING SLOT</h1>
        <p class="desc">Trải nghiệm siêu phẩm nông trại kết hợp săn cá giải trí đỉnh cao. Thu hoạch cực đã, giải trí thả ga mỗi ngày!</p>
        
        <a href="https://github.com/NONGTRAIVUIVE467/FISINGSLOT/releases/download/V1.4/FISING.SLOTapk.apk" class="btn-download">
            📥 TẢI GAME NGAY
        </a>

        <p class="footer-text">
            <span>🛡️</span> An toàn & Bảo mật cho Android
        </p>
    </div>

</body>
</html>

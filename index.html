<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tải Game FisingSlot</title>
    <style>
        /* CSS reset cơ bản */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            /* Nền màu xanh mạ non pastel, cực dịu mắt */
            background-color: #e8f5e9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Khung nội dung bo tròn mập mạp */
        .mobile-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            /* Viền nâu đất tạo cảm giác gần gũi */
            border: 4px solid #8d6e63;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 0 #bcaaa4;
        }

        .icon-game {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            color: #4caf50;
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        p.desc {
            color: #6d4c41;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Nút bấm tải game khổng lồ cho ngón tay dễ chạm */
        .btn-download {
            display: block;
            background-color: #ff9800; /* Màu cam nổi bật */
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            padding: 18px 20px;
            border-radius: 25px;
            border: 3px solid #e65100;
            box-shadow: 0 6px 0 #e65100;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        /* Hiệu ứng lún xuống khi dùng ngón tay chạm vào (trên điện thoại) */
        .btn-download:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #e65100;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 13px;
            color: #9e9e9e;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div class="icon-game">🐟🎰🌱</div>
        
        <h1>FISING SLOT</h1>
        <p class="desc">Chơi game thả ga, thu hoạch cực đã! Nhấn nút bên dưới để cài đặt về điện thoại ngay nhé.</p>
        
        <a href="https://github.com/NONGTRAIVUIVE467/FISINGSLOT/releases/download/1.0/FISINGSLOT.apk" class="btn-download">
            📥 TẢI GAME NGAY
        </a>

        <p class="footer-text">Hỗ trợ các thiết bị Android</p>
    </div>

</body>
</html>
